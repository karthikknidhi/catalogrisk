[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalogrisk"
version = "0.1.0"
description = "Weakest-link risk for AI agent tool catalogs: catalog vulnerability, effective independent decisions, tolerable error rate"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Karthik Karunanithi"}]
requires-python = ">=3.9"
keywords = ["ai-agents", "mcp", "tool-use", "security", "manifests", "information-flow-control"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License", "Topic :: Security"]

[project.urls]
Paper = "https://arxiv.org/abs/2611.31338"
Source = "https://github.com/karthikknidhi/catalogrisk"

[project.scripts]
catalogrisk = "catalogrisk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
